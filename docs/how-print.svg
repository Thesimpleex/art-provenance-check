<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="0.5" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#fff4ec"/>
    </linearGradient>
    <radialGradient id="spek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d1d1d6"/>
      <stop offset="0.45" stop-color="#48484a"/>
      <stop offset="1" stop-color="#0e0f12"/>
    </radialGradient>
    <radialGradient id="korn" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2f2f7"/>
      <stop offset="0.6" stop-color="#636366"/>
      <stop offset="1" stop-color="#0e0f12"/>
    </radialGradient>
    <pattern id="raster" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <rect width="9" height="9" fill="#f7f3ea"/>
      <circle cx="4.5" cy="4.5" r="2.6" fill="#1c1c1e"/>
    </pattern>
    <pattern id="raster2" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(75)">
      <circle cx="4.5" cy="4.5" r="1.6" fill="#e0457b" opacity="0.75"/>
    </pattern>
    <filter id="schatten" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.07"/>
    </filter>
    <marker id="pfeil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#a1a1a6" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <clipPath id="foto"><rect x="60" y="182" width="168" height="124" rx="12"/></clipPath>
    <clipPath id="fft"><rect x="308" y="182" width="168" height="124" rx="12"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="28" fill="#ffffff" stroke="#e5e5ea"/>

  <text x="40" y="52" font-size="13" font-weight="600" fill="#ff4f00">HOW IT WORKS</text>
  <text x="40" y="80" font-size="24" font-weight="700" fill="#0a0a0a" letter-spacing="-0.4">From macro photo to print process</text>

  <!-- 1 Foto -->
  <g filter="url(#schatten)"><rect x="40" y="112" width="208" height="228" rx="20" fill="#fff" stroke="#e5e5ea"/></g>
  <text x="60" y="142" font-size="11" font-weight="700" fill="#a1a1a6">01</text>
  <text x="60" y="164" font-size="16" font-weight="700" fill="#0a0a0a">Macro photo</text>
  <g clip-path="url(#foto)">
    <rect x="60" y="182" width="168" height="138" fill="url(#raster)"/>
    <rect x="60" y="182" width="168" height="138" fill="url(#raster2)"/>
  </g>
  <text x="60" y="326" font-size="11" fill="#6e6e73">10–30× · phone + clip-on lens</text>

  <line x1="256" y1="236" x2="280" y2="236" stroke="#a1a1a6" stroke-width="1.6" marker-end="url(#pfeil)"/>

  <!-- 2 FFT -->
  <g filter="url(#schatten)"><rect x="288" y="112" width="208" height="228" rx="20" fill="#fff" stroke="#e5e5ea"/></g>
  <text x="308" y="142" font-size="11" font-weight="700" fill="#a1a1a6">02</text>
  <text x="308" y="164" font-size="16" font-weight="700" fill="#0a0a0a">Fourier spectrum</text>
  <g clip-path="url(#fft)">
    <rect x="308" y="182" width="168" height="138" fill="url(#spek)"/>
    <g fill="#ffffff">
      <circle cx="392" cy="251" r="2.4"/>
      <circle cx="411" cy="246" r="1.8"/><circle cx="373" cy="256" r="1.8"/><circle cx="397" cy="232" r="1.8"/><circle cx="387" cy="270" r="1.8"/>
      <circle cx="406" cy="267" r="1.8"/><circle cx="378" cy="235" r="1.8"/><circle cx="414" cy="230" r="1.4"/><circle cx="370" cy="272" r="1.4"/>
      <circle cx="430" cy="241" r="1.2"/><circle cx="354" cy="261" r="1.2"/><circle cx="402" cy="213" r="1.2"/><circle cx="382" cy="289" r="1.2"/>
    </g>
  </g>
  <text x="308" y="326" font-size="11" fill="#6e6e73">per tile and colour channel</text>

  <line x1="504" y1="236" x2="528" y2="236" stroke="#a1a1a6" stroke-width="1.6" marker-end="url(#pfeil)"/>

  <!-- 3 Spitzen -->
  <g filter="url(#schatten)"><rect x="536" y="112" width="208" height="228" rx="20" fill="#fff" stroke="#e5e5ea"/></g>
  <text x="556" y="142" font-size="11" font-weight="700" fill="#a1a1a6">03</text>
  <text x="556" y="164" font-size="16" font-weight="700" fill="#0a0a0a">Measure</text>
  <g font-size="12.5" fill="#3a3a3c">
    <rect x="556" y="182" width="168" height="34" rx="10" fill="#f2f2f7"/>
    <text x="568" y="204">Screen angles</text><text x="712" y="204" text-anchor="end" font-weight="700" fill="#0a0a0a">4</text>
    <rect x="556" y="222" width="168" height="34" rx="10" fill="#f2f2f7"/>
    <text x="568" y="244">Energy in peaks</text><text x="712" y="244" text-anchor="end" font-weight="700" fill="#0a0a0a">93 %</text>
    <rect x="556" y="262" width="168" height="34" rx="10" fill="#f2f2f7"/>
    <text x="568" y="284">Fine / coarse</text><text x="712" y="284" text-anchor="end" font-weight="700" fill="#0a0a0a">1.96</text>
  </g>
  <text x="556" y="324" font-size="11" fill="#6e6e73">peaks at right angles = dot screen</text>

  <line x1="752" y1="236" x2="776" y2="236" stroke="#a1a1a6" stroke-width="1.6" marker-end="url(#pfeil)"/>

  <!-- 4 Ergebnis -->
  <g filter="url(#schatten)"><rect x="784" y="112" width="376" height="228" rx="20" fill="#fff" stroke="#e5e5ea"/></g>
  <text x="804" y="142" font-size="11" font-weight="700" fill="#a1a1a6">04</text>
  <text x="804" y="164" font-size="16" font-weight="700" fill="#0a0a0a">Classification</text>
  <g font-size="12.5">
    <rect x="804" y="184" width="336" height="44" rx="12" fill="#fff1ea" stroke="#ff4f00" stroke-width="1.5"/>
    <circle cx="824" cy="206" r="5" fill="#ff4f00"/>
    <text x="840" y="203" font-weight="700" fill="#0a0a0a">Offset screen</text>
    <text x="840" y="219" font-size="11" fill="#6e6e73">photomechanical reproduction</text>
    <text x="1128" y="210" text-anchor="end" font-weight="700" fill="#ff4f00">peaks</text>
    <rect x="804" y="234" width="336" height="44" rx="12" fill="#f2f2f7"/>
    <circle cx="824" cy="256" r="5" fill="#c27c0e"/>
    <text x="840" y="253" font-weight="700" fill="#0a0a0a">Inkjet / giclée</text>
    <text x="840" y="269" font-size="11" fill="#6e6e73">fine, irregular dots</text>
    <text x="1128" y="260" text-anchor="end" fill="#6e6e73">no peaks, fine</text>
    <rect x="804" y="284" width="336" height="44" rx="12" fill="#f2f2f7"/>
    <circle cx="824" cy="306" r="5" fill="#8e8e93"/>
    <text x="840" y="303" font-weight="700" fill="#0a0a0a">Stone lithography</text>
    <text x="840" y="319" font-size="11" fill="#6e6e73">clumpy grain, no screen</text>
    <text x="1128" y="310" text-anchor="end" fill="#6e6e73">no peaks, coarse</text>
  </g>
</svg>
