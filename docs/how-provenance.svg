<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4ec"/>
      <stop offset="0.55" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="schatten" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.07"/>
    </filter>
    <marker id="pfeil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#a1a1a6" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="28" fill="#ffffff" stroke="#e5e5ea"/>

  <text x="40" y="52" font-size="13" font-weight="600" fill="#ff4f00">HOW IT WORKS</text>
  <text x="40" y="80" font-size="24" font-weight="700" fill="#0a0a0a" letter-spacing="-0.4">From catalogue text to review record</text>

  <!-- 1 Eingabe -->
  <g filter="url(#schatten)">
    <rect x="40" y="112" width="208" height="228" rx="20" fill="#ffffff" stroke="#e5e5ea"/>
  </g>
  <text x="60" y="142" font-size="11" font-weight="700" fill="#a1a1a6">01</text>
  <text x="60" y="164" font-size="16" font-weight="700" fill="#0a0a0a">Catalogue text</text>
  <rect x="60" y="180" width="168" height="140" rx="12" fill="#f2f2f7"/>
  <g font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#3a3a3c">
    <text x="72" y="202">Collection E. Example,</text>
    <text x="72" y="218">Vienna (until 1938);</text>
    <text x="72" y="234" fill="#ff4f00">confiscated 1938;</text>
    <text x="72" y="250">Karl Haberstock</text>
    <text x="72" y="266">gallery, Berlin (1939);</text>
    <text x="72" y="282">private collection,</text>
    <text x="72" y="298">Germany</text>
  </g>

  <line x1="256" y1="226" x2="280" y2="226" stroke="#a1a1a6" stroke-width="1.6" marker-end="url(#pfeil)"/>

  <!-- 2 Stationen -->
  <g filter="url(#schatten)">
    <rect x="288" y="112" width="208" height="228" rx="20" fill="#ffffff" stroke="#e5e5ea"/>
  </g>
  <text x="308" y="142" font-size="11" font-weight="700" fill="#a1a1a6">02</text>
  <text x="308" y="164" font-size="16" font-weight="700" fill="#0a0a0a">Parse stations</text>
  <g font-size="12" fill="#3a3a3c">
    <rect x="308" y="180" width="168" height="30" rx="9" fill="#f2f2f7"/>
    <text x="318" y="199" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#a1a1a6">01</text><text x="342" y="199">Collection</text><text x="466" y="199" text-anchor="end" fill="#6e6e73">–1938</text>
    <rect x="308" y="216" width="168" height="30" rx="9" fill="#fff1ea"/>
    <text x="318" y="235" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#ff4f00">02</text><text x="342" y="235">Seizure</text><text x="466" y="235" text-anchor="end" fill="#6e6e73">1938</text>
    <rect x="308" y="252" width="168" height="30" rx="9" fill="#fff1ea"/>
    <text x="318" y="271" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#ff4f00">03</text><text x="342" y="271">Dealer</text><text x="466" y="271" text-anchor="end" fill="#6e6e73">1939</text>
    <rect x="308" y="288" width="168" height="30" rx="9" fill="#f2f2f7"/>
    <text x="318" y="307" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#a1a1a6">04</text><text x="342" y="307">Anonymous</text><text x="466" y="307" text-anchor="end" fill="#6e6e73">n.d.</text>
  </g>

  <line x1="504" y1="226" x2="528" y2="226" stroke="#a1a1a6" stroke-width="1.6" marker-end="url(#pfeil)"/>

  <!-- 3 Zeitraum -->
  <g filter="url(#schatten)">
    <rect x="536" y="112" width="208" height="228" rx="20" fill="#ffffff" stroke="#e5e5ea"/>
  </g>
  <text x="556" y="142" font-size="11" font-weight="700" fill="#a1a1a6">03</text>
  <text x="556" y="164" font-size="16" font-weight="700" fill="#0a0a0a">1933–1945</text>
  <text x="556" y="184" font-size="12" fill="#6e6e73">year by year, § 44 KGSG</text>
  <g>
    <rect x="556" y="200" width="20" height="44" rx="5" fill="#d1d1d6"/>
    <rect x="580" y="200" width="20" height="44" rx="5" fill="#d1d1d6"/>
    <rect x="604" y="200" width="20" height="44" rx="5" fill="#d1d1d6"/>
    <rect x="628" y="200" width="20" height="44" rx="5" fill="#0a0a0a"/>
    <rect x="652" y="200" width="20" height="44" rx="5" fill="#0a0a0a"/>
    <rect x="676" y="201" width="18" height="42" rx="5" fill="#ffffff" stroke="#ff4f00" stroke-width="2"/>
    <rect x="700" y="201" width="18" height="42" rx="5" fill="#ffffff" stroke="#ff4f00" stroke-width="2"/>
  </g>
  <g font-size="10" fill="#a1a1a6" text-anchor="middle">
    <text x="566" y="260">33</text><text x="614" y="260">35</text><text x="638" y="260">38</text><text x="662" y="260">39</text><text x="709" y="260">45</text>
  </g>
  <g font-size="11.5" fill="#3a3a3c">
    <rect x="556" y="276" width="10" height="10" rx="3" fill="#0a0a0a"/><text x="572" y="285">documented</text>
    <rect x="556" y="294" width="10" height="10" rx="3" fill="#d1d1d6"/><text x="572" y="303">inferred</text>
    <rect x="557" y="313" width="8" height="8" rx="2" fill="#fff" stroke="#ff4f00" stroke-width="2"/><text x="572" y="321">open</text>
  </g>

  <line x1="752" y1="226" x2="776" y2="226" stroke="#a1a1a6" stroke-width="1.6" marker-end="url(#pfeil)"/>

  <!-- 4 Referenzliste -->
  <g filter="url(#schatten)">
    <rect x="784" y="112" width="168" height="228" rx="20" fill="#ffffff" stroke="#e5e5ea"/>
  </g>
  <text x="804" y="142" font-size="11" font-weight="700" fill="#a1a1a6">04</text>
  <text x="804" y="164" font-size="16" font-weight="700" fill="#0a0a0a">Name match</text>
  <text x="804" y="184" font-size="12" fill="#6e6e73">Wikidata · CC0</text>
  <rect x="804" y="200" width="128" height="62" rx="12" fill="#fff1ea"/>
  <text x="816" y="222" font-size="12.5" font-weight="600" fill="#0a0a0a">Karl Haberstock</text>
  <text x="816" y="239" font-size="11" fill="#6e6e73">1878–1956</text>
  <text x="816" y="254" font-size="11" fill="#ff4f00">ALIU reports</text>
  <text x="804" y="290" font-size="11.5" fill="#3a3a3c">spelling variants,</text>
  <text x="804" y="306" font-size="11.5" fill="#3a3a3c">initials, aliases;</text>
  <text x="804" y="322" font-size="11.5" fill="#3a3a3c">first name must fit</text>

  <line x1="960" y1="226" x2="984" y2="226" stroke="#a1a1a6" stroke-width="1.6" marker-end="url(#pfeil)"/>

  <!-- 5 Ergebnis -->
  <g filter="url(#schatten)">
    <rect x="992" y="112" width="168" height="228" rx="20" fill="#ffffff" stroke="#e5e5ea"/>
  </g>
  <text x="1012" y="142" font-size="11" font-weight="700" fill="#a1a1a6">05</text>
  <text x="1012" y="164" font-size="16" font-weight="700" fill="#0a0a0a">Review record</text>
  <rect x="1012" y="180" width="128" height="72" rx="12" fill="#ffffff" stroke="#e5e5ea"/>
  <text x="1024" y="200" font-size="11" fill="#6e6e73">Review level</text>
  <text x="1024" y="228" font-size="24" font-weight="700" fill="#0a0a0a" letter-spacing="-0.5">High</text>
  <rect x="1024" y="238" width="33" height="4" rx="2" fill="#ff4f00"/>
  <rect x="1060" y="238" width="33" height="4" rx="2" fill="#ff4f00"/>
  <rect x="1096" y="238" width="33" height="4" rx="2" fill="#ff4f00"/>
  <g font-size="11.5" fill="#3a3a3c">
    <text x="1012" y="276">PDF · checksums</text>
    <text x="1012" y="294">§ 42 KGSG checklist</text>
    <text x="1012" y="312">never a clearance</text>
  </g>
  <text x="1012" y="330" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="10" fill="#a1a1a6">PP-4EF4FDA8</text>
</svg>
